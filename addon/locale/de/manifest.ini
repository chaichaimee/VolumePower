summary = "Lautstärke und Energie"
description = """VolumePower bietet eine schnelle Steuerung der NVDA-Lautstärke, der Balance für das linke und rechte Ohr sowie der Energieoptionen des Computers. Passen Sie die NVDA-Lautstärke mit NVDA+Shift+BildAuf und BildAb an, öffnen Sie die Ohren-Lautstärkeebene mit NVDA+Shift+NumPad Plus und fahren Sie den Computer herunter oder starten Sie ihn neu mit Alt+Windows+S durch einfaches oder doppeltes Tippen. Ein Audioschutz stellt stummgeschaltete oder leise Töne beim Start wieder her.

Tastenkombinationen:
Alt+Windows+S
Einfach tippen: Computer herunterfahren
Doppelt tippen: Computer neu starten
NVDA+Shift+BildAuf: NVDA-Lautstärke erhöhen
NVDA+Shift+BildAb: NVDA-Lautstärke verringern
NVDA+Shift+NumPad Plus: Ohren-Lautstärkeebene öffnen"""