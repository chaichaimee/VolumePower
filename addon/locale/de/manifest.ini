summary = "Lautstärke und Energie"
description = """VolumePower bietet eine Schnellsteuerung für die NVDA-Lautstärke, die Balance für das linke und rechte Ohr sowie die Computerenergie. Passen Sie die NVDA-Lautstärke mit NVDA+Shift+BildAuf und BildAb an, öffnen Sie die Ohr-Lautstärkenebene mit NVDA+Shift+NumPad Plus und fahren Sie den Computer mit Alt+Windows+S durch einfaches oder doppeltes Tippen herunter oder starten Sie ihn neu. Ein Audio-Schutz stellt stummgeschaltete oder leise Töne beim Start wieder her."""