summary = "Volumen y energía"
description = """Volumen y energía ofrece un control rápido sobre el volumen de NVDA, los niveles del oído izquierdo y derecho, y la energía del equipo. Ajusta el volumen de NVDA con NVDA+Mayús+RePág y AvPág, abre la capa de volumen de los oídos con NVDA+Mayús+Teclado Numérico Más, y apaga o reinicia con Alt+Windows+S mediante una o dos pulsaciones. Un protector de audio restaura el sonido silenciado o bajo al iniciar.

Teclas rápidas:
Alt+Windows+S
Una pulsación: Apagar equipo
Doble pulsación: Reiniciar equipo
NVDA+Mayús+RePág: Subir volumen de NVDA
NVDA+Mayús+AvPág: Bajar volumen de NVDA
NVDA+Mayús+Teclado numérico más: Abrir la capa de volumen de los oídos"""