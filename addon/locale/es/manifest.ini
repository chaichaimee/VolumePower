summary = "Volumen y energía"
description = """Volumen y energía ofrece un control rápido del volumen de NVDA, los niveles de los oídos izquierdo y derecho, y la energía del equipo. Ajusta el volumen de NVDA con NVDA+Mayús+Re Pág y Av Pág, abre la capa de volumen de los oídos con NVDA+Mayús+NumPad Más, y apaga o reinicia con Alt+Windows+S usando una o dos pulsaciones. Un protector de audio restablece el sonido silenciado o bajo al iniciar."""