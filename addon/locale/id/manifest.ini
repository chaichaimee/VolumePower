summary = "VolumePower"
description = """VolumePower memberikan kontrol cepat atas volume NVDA, tingkat telinga kiri dan kanan, serta daya komputer. Atur volume NVDA dengan NVDA+Shift+PageUp dan PageDown, buka lapisan volume telinga dengan NVDA+Shift+NumPad Plus, dan matikan atau mulai ulang dengan Alt+Windows+S menggunakan ketukan tunggal atau ganda. Pengaman audio memulihkan suara yang disenyapkan atau kecil saat permulaan.

Tombol Pintas:
Alt+Windows+S
Ketukan Tunggal : Matikan komputer
Ketukan Ganda : Mulai ulang komputer
NVDA+Shift+PageUp Perbesar volume NVDA
NVDA+Shift+PageDown Perkecil volume NVDA
NVDA+Shift+NumPad Plus : Buka lapisan volume telinga"""