summary = "VolumePower"
description = """VolumePower memberikan kontrol cepat terhadap volume NVDA, tingkat telinga kiri dan kanan, serta daya komputer. Sesuaikan volume NVDA dengan NVDA+Shift+PageUp dan PageDown, buka lapisan volume telinga dengan NVDA+Shift+NumPad Plus, dan matikan atau mulai ulang dengan Alt+Windows+S menggunakan ketukan tunggal atau ganda. Pelindung audio memulihkan suara yang bisu atau rendah saat permulaan."""