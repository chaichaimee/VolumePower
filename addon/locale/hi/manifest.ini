summary = "वॉल्यूम पावर"
description = """वॉल्यूम पावर एनवीडीए वॉल्यूम, बाएं और दाएं कान के स्तर और कंप्यूटर पावर पर त्वरित नियंत्रण देता है। एनवीडीए+शिफ्ट+पेजअप और पेजडाउन के साथ एनवीडीए वॉल्यूम समायोजित करें, एनवीडीए+शिफ्ट+नंपैड प्लस के साथ ईयर वॉल्यूम लेयर खोलें, और सिंगल या डबल टैप का उपयोग करके Alt+Windows+S से शट डाउन या रीस्टार्ट करें। एक ऑडियो गार्ड स्टार्टअप पर म्यूट या कम ध्वनि को पुनर्स्थापित करता है।

हॉट कीज़:
Alt+Windows+S
सिंगल टैप : कंप्यूटर शट डाउन करें
डबल टैप : कंप्यूटर रीस्टार्ट करें
NVDA+Shift+PageUp : एनवीडीए वॉल्यूम बढ़ाएं
NVDA+Shift+PageDown : एनवीडीए वॉल्यूम घटाएं
NVDA+Shift+NumPad Plus : ईयर वॉल्यूम लेयर खोलें"""