summary = "ปรับระดับเสียงและพลังงาน"
description = """VolumePower ให้การควบคุมที่รวดเร็วสำหรับระดับเสียง NVDA ระดับเสียงหูซ้ายและขวา และพลังงานคอมพิวเตอร์ ปรับระดับเสียง NVDA ด้วย NVDA+Shift+PageUp และ PageDown, เปิดเลเยอร์ระดับเสียงหูด้วย NVDA+Shift+NumPad Plus, และปิดเครื่องหรือรีสตาร์ทด้วย Alt+Windows+S โดยการแตะครั้งเดียวหรือสองครั้ง ระบบป้องกันเสียงจะคืนค่าเสียงที่ปิดหรือเบาเมื่อเริ่มต้นระบบ"""