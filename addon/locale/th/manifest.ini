summary = "ระดับเสียงและพลังงาน"
description = """VolumePower ช่วยให้คุณควบคุมระดับเสียงของ NVDA ระดับเสียงหูซ้ายและขวา และพลังงานของคอมพิวเตอร์ได้อย่างรวดเร็ว ปรับระดับเสียง NVDA ด้วย NVDA+Shift+PageUp และ PageDown เปิดเลเยอร์ระดับเสียงหูด้วย NVDA+Shift+NumPad Plus และปิดเครื่องหรือรีสตาร์ทด้วย Alt+Windows+S โดยการแตะครั้งเดียวหรือสองครั้ง มีระบบป้องกันเสียงที่จะคืนค่าเสียงที่ถูกปิดหรือเบาเกินไปเมื่อเริ่มต้นระบบ

ปุ่มลัด:
Alt+Windows+S
แตะครั้งเดียว : ปิดเครื่องคอมพิวเตอร์
แตะสองครั้ง : รีสตาร์ทคอมพิวเตอร์
NVDA+Shift+PageUp เพิ่มระดับเสียง NVDA
NVDA+Shift+PageDown ลดระดับเสียง NVDA
NVDA+Shift+NumPad Plus : เปิดเลเยอร์ระดับเสียงหู"""