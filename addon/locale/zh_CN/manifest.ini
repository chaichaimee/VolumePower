summary = "音量与电源"
description = """音量与电源（VolumePower）可让您快速控制 NVDA 音量、左右耳音量平衡以及电脑电源。使用 NVDA+Shift+PageUp 和 PageDown 调节 NVDA 音量，使用 NVDA+Shift+小键盘加号打开耳音量层，通过 Alt+Windows+S 单击或双击关机或重启。音频保护功能可在启动时恢复被静音或过低的声音。

快捷键：
Alt+Windows+S
单击：关闭计算机
双击：重启计算机
NVDA+Shift+PageUp：增加 NVDA 音量
NVDA+Shift+PageDown：减少 NVDA 音量
NVDA+Shift+小键盘加号：打开耳音量层"""