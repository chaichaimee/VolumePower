summary = "مستوى الصوت والطاقة"
description = """يتيح VolumePower تحكماً سريعاً في مستوى صوت NVDA، ومستويات الأذن اليمنى واليسرى، وتطبيقات طاقة الكمبيوتر. اضبط صوت NVDA باستخدام NVDA+Shift+PageUp وPageDown، وافتح طبقة صوت الأذنين باستخدام NVDA+Shift+NumPad Plus، وأوقف التشغيل أو أعد التشغيل باستخدام Alt+Windows+S بنقرة مفردة أو مزدوجة. يعمل واقي الصوت على استعادة الصوت الصامت أو المنخفض عند بدء التشغيل."""