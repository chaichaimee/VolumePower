summary = "مستوى الصوت والطاقة"
description = """يمنحك VolumePower تحكماً سريعاً في مستوى صوت NVDA، ومستويات الأذن اليسرى واليمنى، وكمبيوتر الطاقة. اضبط مستوى صوت NVDA باستخدام NVDA+Shift+PageUp وPageDown، وافتح طبقة صوت الأذن باستخدام NVDA+Shift+NumPad Plus، وأوقف التشغيل أو أعد التشغيل باستخدام Alt+Windows+S بنقرة واحدة أو نقرتين. يعمل واقي الصوت على استعادة الصوت الصامت أو المنخفض عند بدء التشغيل.

مفاتيح الاختصار:
Alt+Windows+S
نقرة واحدة: إيقاف تشغيل الكمبيوتر
نقرتان: إعادة تشغيل الكمبيوتر
NVDA+Shift+PageUp: زيادة مستوى صوت NVDA
NVDA+Shift+PageDown: خفض مستوى صوت NVDA
NVDA+Shift+NumPad Plus: فتح طبقة صوت الأذن"""