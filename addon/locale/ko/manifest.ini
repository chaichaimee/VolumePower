summary = "볼륨파워"
description = """볼륨파워는 NVDA 볼륨, 좌우 귀 볼륨, 그리고 컴퓨터 전원을 빠르게 제어할 수 있는 기능을 제공합니다. NVDA+Shift+PageUp 및 PageDown으로 NVDA 볼륨을 조절하고, NVDA+Shift+넘패드 플러스로 귀 볼륨 레이어를 열며, Alt+Windows+S를 한 번 또는 두 번 눌러 시스템을 종료하거나 재시작할 수 있습니다. 또한 오디오 가드 기능이 시작 시 음소거되었거나 낮은 소리를 복원해 줍니다.

단축키:
Alt+Windows+S
한 번 누르기: 컴퓨터 종료
두 번 누르기: 컴퓨터 재시작
NVDA+Shift+PageUp: NVDA 볼륨 높이기
NVDA+Shift+PageDown: NVDA 볼륨 낮이기
NVDA+Shift+넘패드 플러스: 귀 볼륨 레이어 열기"""