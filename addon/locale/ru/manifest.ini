summary = "Управление звуком и питанием"
description = """Управление звуком и питанием предоставляет быстрый доступ к регулировке громкости NVDA, балансу левого и правого уха, а также управлению питанием компьютера. Настраивайте громкость NVDA с помощью NVDA+Shift+PageUp и PageDown, открывайте слой регулировки баланса по ушам с помощью NVDA+Shift+цифровой плюс, а также выключайте или перезагружайте компьютер комбинацией Alt+Windows+S с одинаковым или двойным нажатием. Защита слуха восстанавливает отключенный или тихий звук при запуск."""