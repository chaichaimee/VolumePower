summary = "Громкость и питание"
description = """VolumePower предоставляет быстрый доступ к управлению громкостью NVDA, уровнями левого и правого ушей, а также питанием компьютера. Регулируйте громкость NVDA с помощью NVDA+Shift+PageUp и PageDown, открывайте слой громкости по ушам с помощью NVDA+Shift+NumPad Plus, а также выключайте или перезагружайте компьютер с помощью Alt+Windows+S одиночным или двойным нажатием. Функция защиты слуха восстанавливает отключенный или тихий звук при запуск

Горячие клавиши:
Alt+Windows+S
Одиночное нажатие: Выключить компьютер
Двойное нажатие: Перезагрузить компьютер
NVDA+Shift+PageUp: Увеличить громкость NVDA
NVDA+Shift+PageDown: Уменьшить громкость NVDA
NVDA+Shift+NumPad Plus: Открыть слой громкости по ушам"""