summary = "Гучність та живлення"
description = """Додаток VolumePower надає швидкий доступ до керування гучністю NVDA, рівнем звуку в лівому й правому вухах та живленням комп'ютера. Регулюйте гучність NVDA за допомогою NVDA+Shift+PageUp і PageDown, відкривайте шар налаштування гучності для вух за допомогою NVDA+Shift+NumPad Plus, а також вимикайте або перезавантажуйте комп'ютер за допомогою Alt+Windows+S одним чи подвійним натисканням. Функція захисту звуку відновлює вимкнений або тихий звук під час запуску.

Гарячі клавіші:
Alt+Windows+S
Одинарне натискання: Вимкнути комп'ютер
Подвійне натискання: Перезавантажити комп'ютер
NVDA+Shift+PageUp: Збільшити гучність NVDA
NVDA+Shift+PageDown: Зменшити гучність NVDA
NVDA+Shift+NumPad Plus: Відкрити шар гучності для вух"""