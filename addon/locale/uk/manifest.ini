summary = "Гучність і живлення"
description = """Додаток VolumePower забезпечує швидке керування гучністю NVDA, рівнями правого та лівого вух і живленням комп'ютера. Регулюйте гучність NVDA за допомогою NVDA+Shift+PageUp і PageDown, відкривайте шар гучності для кожного вуха за допомогою NVDA+Shift+NumPad Plus, а також вимикайте чи перезавантажуйте комп'ютер за допомогою Alt+Windows+S одиночним або подвійним натисканням. Аудіозахист відновлює вимкнений або тихий звук під час запуску."""