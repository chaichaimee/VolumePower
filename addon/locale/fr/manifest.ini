summary = "VolumePower"
description = """VolumePower permet un contrôle rapide du volume d'NVDA, des niveaux des oreilles gauche et droite, ainsi que de l'alimentation de l'ordinateur. Ajustez le volume d'NVDA avec NVDA+Shift+PageUp et PageDown, ouvrez la couche de volume des oreilles avec NVDA+Shift+Pavé Numérique Plus, et éteignez ou redémarrez avec Alt+Windows+S en utilisant une simple ou double pression. Une protection audio restaure le son coupé ou bas au démarrage."""