summary = "VolumePower"
description = """VolumePower permet de contrôler rapidement le volume d'NVDA, les niveaux des oreilles gauche et droite, ainsi que l'alimentation de l'ordinateur. Ajustez le volume d'NVDA avec NVDA+Shift+PageUp et PageDown, ouvrez la couche de volume des oreilles avec NVDA+Shift+Pavé Numérique Plus, et arrêtez ou redémarrez avec Alt+Windows+S en un simple ou double appui. Une protection audio rétablit le son coupé ou faible au démarrage.

Raccourcis clavier :
Alt+Windows+S
Simple appui : Arrêter l'ordinateur
Double appui : Redémarrer l'ordinateur
NVDA+Shift+PageUp : Augmenter le volume d'NVDA
NVDA+Shift+PageDown : Diminuer le volume d'NVDA
NVDA+Shift+Pavé Numérique Plus : Ouvrir la couche de volume des oreilles"""