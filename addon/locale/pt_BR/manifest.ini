summary = "VolumePower"
description = """VolumePower oferece controle rápido sobre o volume do NVDA, os níveis dos ouvidos esquerdo e direito, e a energia do computador. Ajuste o volume do NVDA com NVDA+Shift+PageUp e PageDown, abra a camada de volume dos ouvidos com NVDA+Shift+NumPad Mais, e desligue ou reinicie com Alt+Windows+S usando um ou dois toques. Um protetor de áudio restaura o som silenciado ou baixo na inicialização.

Teclas de Atalho:
Alt+Windows+S
Um Toque : Desligar o computador
Dois Toques : Reiniciar o computador
NVDA+Shift+PageUp Aumentar o volume do NVDA
NVDA+Shift+PageDown Diminuir o volume do NVDA
NVDA+Shift+NumPad Mais : Abrir a camada de volume dos ouvidos"""