summary = "Ses ve Güç"
description = """Ses ve Güç, NVDA ses seviyesine, sol ve sağ kulak düzeylerine ve bilgisayar güç seçeneklerine hızlı erişim sağlar. NVDA ses seviyesini NVDA+Shift+PageUp ve PageDown ile ayarlayın, NVDA+Shift+NumPad Artı ile kulak ses düzeyi katmanını açın ve Alt+Windows+S tuşlarına tek veya çift basarak kapatın veya yeniden başlatın. Ses koruması, başlangıçta sessize alınan veya düşük olan sesi eski haline getirir."""