summary = "كالان طاقة الحجم"
description = """يمنحك كالان طاقة الحجم تحكماً سريعاً في مستوى صوت NVDA، ومستويي الأذن اليمنى واليسرى، وطاقة الكمبيوتر. اضبط مستوى صوت NVDA باستخدام NVDA+Shift+PageUp وPageDown، وافتح طبقة صوت الأذن باستخدام NVDA+Shift+NumPad Plus، وأوقف التشغيل أو أعد التشغيل باستخدام Alt+Windows+S بنقرة واحدة أو نقرتين. يقوم واقي صوتي استعادة الصوت المكتتم أو المنخفض عند بدء التشغيل.

مفاتيح الاختصار:
Alt+Windows+S
نقرة واحدة: إيقاف تشغيل الكمبيوتر
نقرة مزدوجة: إعادة تشغيل الكمبيوتر
NVDA+Shift+PageUp: زيادة مستوى صوت NVDA
NVDA+Shift+PageDown: خفض مستوى صوت NVDA
NVDA+Shift+NumPad Plus: فتح طبقة صوت الأذن"""