summary = "音量與電源"
description = """音量與電源（VolumePower）讓您能快速控制 NVDA 音效大小、左右耳音量平衡以及電腦電源。使用 NVDA+Shift+PageUp 和 PageDown 調整 NVDA 音量，使用 NVDA+Shift+數字鍵盤加號開啟左右耳音量層，並透過 Alt+Windows+S 的單擊或雙擊來關機或重新開機。音訊防護機制會在啟動時恢復被靜音或過小的聲音。

快速鍵：
Alt+Windows+S
單擊：關閉電腦
雙擊：重新開機
NVDA+Shift+PageUp：提高 NVDA 音量
NVDA+Shift+PageDown：降低 NVDA 音量
NVDA+Shift+數字鍵盤加號：開啟左右耳音量層"""