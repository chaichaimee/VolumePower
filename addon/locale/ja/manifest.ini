summary = "音量と電源"
description = """VolumePowerは、NVDAの音量、左右の耳の音量バランス、およびパソコンの電源を素早く操作するための機能を提供します。NVDA+Shift+PageUpおよびPageDownでNVDAの音量を調節し、NVDA+Shift+テンキーのプラスで左右耳音量レイヤーを開き、Alt+Windows+Sのシングルタップまたはダブルタップでシャットダウンや再起動を行います。また、起動時にミュートや低い音量を自動的に復元するオーディオガード機能も備えています。

ホットキー：
Alt+Windows+S
シングルタップ： パソコンをシャットダウン
ダブルタップ： パソコンを再起動
NVDA+Shift+PageUp： NVDAの音量を上げる
NVDA+Shift+PageDown： NVDAの音量を下げる
NVDA+Shift+テンキーのプラス： 左右耳音量レイヤーを開く"""